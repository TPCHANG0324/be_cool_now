<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>環保市集-商品頁</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <!-- 環保市集_商品頁面_主選單 -->
    <header class="Fp_Header_H">選單</header>

    <!-- 環保市集_商品頁面_商品購買 -->
     <section class="Sp_productChoice_H">

        <!-- 麵包屑導航 -->
        <nav class="breadCrumb">
            <ol>
                <li><a href="#">首頁</a></li>
                &nbsp;&gt;&nbsp;
                <li>NT$100~$200</li>
            </ol>
        </nav>

        <!-- 選擇規格及數量 -->
        <section class="Sp_productChoice_top_H">
            <figure>
                <ul>
                    <li><img src="./images/Sp15.jpg" alt=""></li>
                    <li><img src="./images/Sp16.jpg" alt=""></li>
                    <li><img src="./images/Sp17.jpg" alt=""></li>
                    <li><img src="./images/Sp18.jpg" alt=""></li>
                </ul>
                <div><img src="./images/Sp15.jpg" alt=""></div>
            </figure>

            <aside class="Sp_productChoice_info_H">
                <section>
                    <div>
                        <h3>再生材質環保杯</h3>
                        <span>NT$299</span>
                    </div>

                    <ul>
                        <li>重量僅有300g</li>
                        <li>輕巧好攜帶</li>
                        <li>質感必備</li>
                    </ul>
                    
                </section>

                <section>
                    <p>規格</p>

                    <div class="Sp_productChoice_btnGroup_H">
                        <button type="button">200ml</button>
                        <button type="button">350ml</button>
                        <button type="button">500ml</button>
                        <button type="button">750ml</button>
                    </div>

                    <div class="Sp_productChoice_inputGroup_H">
                        <input type="text" class="input">
                    </div>

                    <div class="Sp_productChoice_buyNow_H">
                        <button type="button">加入購物車</button>
                        <button type="button">立即購買</button>
                    </div>

                </section>
                

                
            </aside>
        </section>
     </section>

    <!-- 環保市集_商品頁面_頁尾 -->
    <footer class="Fp_Footer_H">頁尾</footer>

</body>
</html>
