<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>環保市集</title>
    <link rel="stylesheet" href="./css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="wrapper">
        <div class="banner">
            <img src="./images/Sp01.jpg" alt="" class="banner_img">
            <div class="banner_text">
                <h1>環保市集</h1>   
        </div>
     
        
        <div class="fliter-section">
            <h4>首頁/商店</h4>
            <ul>
                <li><a href="#">NT$100~$200</a></li>
                <li><a href="#">NT$200~$300</a></li>
                <li><a href="#">NT$300~$400</a></li>
                <li><a href="#">NT$400~$500</a></li>
                <li><a href="#">NT$500 以上</a></li>
            </ul>
        </div>
            <div class="store_title">
                <h4>商品排序</h4>
                <i class="fa-solid fa-caret-down"></i>
            </div>

            <div class="product-grid">
                <div class="product-card">
                    <a href="#">
                        <img src="./images/Sp02.jpg" alt="環保吸管1" class="product-img">
                    </a>
                    <button class="add-to-cart">加入購物車</button>
                    <div class="bgr_words_1">
                        <h4>環保吸管1</h4>
                        <p>NT$150</p>
                    </div>
                </div>

                <div class="product-card">
                    <a href="#">
                        <img src="./images/Sp03.jpg" alt="環保吸管2" class="product-img">
                    </a>
                    <button class="add-to-cart">加入購物車</button>
                    <div class="bgr_words_2">
                        <h4>環保吸管2</h4>
                        <p>NT$160</p>
                    </div>
                </div>

                <div class="product-card">
                    <a href="#">
                        <img src="./images/Sp04.jpg" alt="環保吸管3" class="product-img">
                    </a>
                    <button class="add-to-cart">加入購物車</button>
                    <div class="bgr_words_1">
                        <h4>環保吸管3</h4>
                        <p>NT$200</p>
                    </div>
                </div>








            </div>


    
</body>
</html>
